<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Log</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏱️</text></svg>">
    <meta name="theme-color" content="#4a5568">
</head>
<body>
    <div class="offline-indicator">Offline</div>

    <div class="container">
        <header class="header">
            <h1>⏱️ Activity Log</h1>
        </header>

        <section class="card">
            <div class="log-header">
                <h2 id="log-title">Today's Log</h2>
                <button id="set-date-btn" hidden>Use this date for new entries</button>
            </div>
            <div class="preset-buttons" id="preset-buttons">
                <!-- Preset buttons injected here -->
            </div>
            <div class="total-today" id="total-today">Total: <strong>0h 0m</strong></div>
            <ul class="log-list" id="activity-log">
                <!-- Log items injected here -->
            </ul>
        </section>

        <section class="card">
            <div class="control-center" id="control-center">
                <div class="start-activity-form">
                    <input type="text" id="new-activity-name" class="activity-input" placeholder="What are you doing?">
                    <button id="delete-preset-btn">-</button>
                    <button id="start-stop-btn">Start</button>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>Recent Days</h2>
            <ul class="recent-days-list" id="recent-days-list">
                <!-- Recent days summary injected here -->
            </ul>
        </section>

    </div>

    <!-- Templates for dynamic content -->
    <template id="preset-button-template">
        <button class="preset-button"></button>
    </template>

    <template id="log-item-template">
        <li class="log-item">
            <div class="log-item-view">
                <div class="log-info">
                    <div class="log-name"></div>
                    <div class="log-time"></div>
                </div>
                <div class="log-duration"></div>
            </div>
            <div class="log-item-edit">
                <div class="edit-field">
                    <label>Start Time</label>
                    <input type="datetime-local" class="edit-start">
                </div>
                <div class="edit-field">
                    <label>End Time</label>
                    <input type="datetime-local" class="edit-end">
                </div>
                <div class="edit-controls">
                    <button class="save-btn">Save</button>
                    <button class="cancel-btn">Cancel</button>
                    <button class="delete-btn">Delete</button>
                </div>
            </div>
        </li>
    </template>

    <template id="recent-day-template">
        <li class="recent-day-item">
            <div class="recent-day-header">
                <span class="recent-day-date"></span>
                <span class="recent-day-total"></span>
            </div>
            <div class="day-summary-bar"></div>
        </li>
    </template>

    <script src="app.js"></script>
</body>
</html>
